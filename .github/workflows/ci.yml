name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Prisma Client
        run: yarn db:generate

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Unit tests
        run: yarn test

      - name: Build
        env:
          # Build-time placeholders; real secrets are required only at runtime
          SESSION_SECRET: ci-session-secret-at-least-32-characters-long
          ENCRYPTION_KEY: ci-encryption-key-at-least-32-characters-long
          CRON_SECRET: ci-cron-secret-16chars
          DATABASE_URL: mysql://user:pass@127.0.0.1:3306/cryptopayserver
        run: yarn build
