version: "3.8"

services:
  app:
    image: viper00/cryptopayserver:0.0.2
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   args:
    #     NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: your_real_project_id
    #     NEXT_PUBLIC_ENVIRONMENT: production
    restart: always
    ports:
      - "8888:3000"
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=mysql://${DB_USER}:${DB_PASSWORD}@db:3306/${DB_DATABASE}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    # ports:
    #   - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USER}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  migrate:
    image: viper00/cryptopayserver:0.0.2
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=mysql://${DB_USER}:${DB_PASSWORD}@db:3306/${DB_DATABASE}
    command: npx prisma migrate deploy
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    profiles:
      - migrate

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge