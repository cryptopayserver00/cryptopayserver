services:
  app:
    image: viper00/cryptopayserver:0.0.3
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   args:
    #     NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: your_real_project_id
    #     NEXT_PUBLIC_ENVIRONMENT: production
    restart: always
    ports:
      - "8888:3000"
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=mysql://${DB_USER}:${DB_PASSWORD}@db:3306/${DB_DATABASE}
      - PORT=3000
    volumes:
      # Persist avatar / store logo uploads across container recreates (standalone writes to public/uploads).
      - app_uploads:/app/public/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').request({host:'127.0.0.1',port:3000,path:'/api/health',method:'HEAD'},(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1)).end()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - shared-network

  # Optional: docker compose --profile redis up
  # If REDIS_URL is set in .env.production, Redis must be reachable or /api/health returns 503.
  redis:
    image: redis:7-alpine
    restart: always
    profiles: [redis]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - shared-network

  worker:
    image: viper00/cryptopayserver:0.0.3
    restart: always
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=mysql://${DB_USER}:${DB_PASSWORD}@db:3306/${DB_DATABASE}
      - SCHEDULE_BASE_URL=http://app:3000/api/schedule/
      - ENABLE_SCHEDULE_WORKER=true
    command: node scripts/schedule-worker.mjs
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - shared-network

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    # ports:
    #   - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USER}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - shared-network

  migrate:
    image: viper00/cryptopayserver:0.0.3
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=mysql://${DB_USER}:${DB_PASSWORD}@db:3306/${DB_DATABASE}
    command: yarn prisma migrate deploy
    depends_on:
      db:
        condition: service_healthy
    networks:
      - shared-network
    profiles:
      - migrate

volumes:
  mysql_data:
  app_uploads:

networks:
  shared-network:
    external: true